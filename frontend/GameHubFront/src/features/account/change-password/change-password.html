<div class="flex flex-col w-full h-full px-6 py-4 items-center">
    <div class="flex flex-1 flex-col items-center justify-center gap-6 w-full">
        <h3 class="font-duality text-xl tracking-wide">Senha</h3>

        <div class="flex flex-col gap-3 w-[70%]">
            <input class="w-full h-9 placeholder:text-gray-400 placeholder:text-[15px] rounded bg-white px-2"
                type="password" [(ngModel)]="currentPassword" placeholder="senha atual" />

            <input class="w-full h-9 placeholder:text-gray-400 placeholder:text-[15px] rounded bg-white px-2"
                type="password" [(ngModel)]="newPassword" placeholder="nova senha (mín. 12 caracteres)" minlength="12" />

            <input class="w-full h-9 placeholder:text-gray-400 placeholder:text-[15px] rounded bg-white px-2"
                type="password" [(ngModel)]="confirmNewPassword" placeholder="confirme a nova senha" />
        </div>
    </div>

    @if (errorMessage()) {
        <p class="text-red-600 text-xs text-center pb-2">{{ errorMessage() }}</p>
    }

    <button type="button" class="flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
        [disabled]="submitting()" (click)="onBackClick()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="size-5 shadow-2xl">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 18.75 7.5-7.5 7.5 7.5" />
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 7.5-7.5 7.5 7.5" />
        </svg>
        @if (dirty()) {
            <span class="font-duality text-sm">{{ submitting() ? 'Salvando...' : 'Salvar alterações' }}</span>
        }
    </button>
</div>
