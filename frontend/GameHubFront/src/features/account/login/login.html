<div class="form-container flex items-center justify-center relative">
    <div class="form-wrapper flex flex-col w-full gap-3 justify-center items-center">

        <button class="btn-primary flex cursor-pointer rounded" (click)="close()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="size-5 shadow-2xl">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 18.75 7.5-7.5 7.5 7.5" />
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 7.5-7.5 7.5 7.5" />
            </svg>
        </button>

        <div class="text-box flex relative items-center gap-2 w-[80%]">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="absolute w-5 h-5 text-gray-500 left-1">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
            </svg>
            <input class="w-full h-8 placeholder:text-gray-400 placeholder:text-[15px] rounded bg-white pl-7"
                type="email" [(ngModel)]="creds.email" placeholder="e-mail" />
        </div>

        <div class="text-box flex relative items-center gap-2 w-[80%]">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="absolute w-5 h-5 text-gray-500 left-1">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
            <input class="w-full h-8 placeholder:text-gray-400 placeholder:text-[15px] rounded bg-white pl-7"
                type="password" [(ngModel)]="creds.password" placeholder="senha" />
        </div>

        <div class="w-[80%] h-fit -mt-3">
            <a class="hover:underline text-[12px] tracking-wide cursor-pointer">Esqueci minha senha</a>
        </div>

        @if (errorMessage(); as message) {
            <span class="text-red-600 text-[12px] w-[80%] text-center">{{ message }}</span>
        }

        <button class="btn-primary rounded-2xl cursor-pointer w-24 h-8 bg-amber-300 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="submitting()" (click)="login()">
            @if (submitting()) {
                Entrando...
            } @else {
                Entrar
            }
        </button>

        <div class="label flex gap-1 justify-around items-center text-[12px]">
            <span>Não tem uma conta?</span>
            <a class="hover:underline cursor-pointer" (click)="showRegister()">Registre-se!</a>
        </div>
    </div>
</div>
