<div class="flex items-center justify-center  relative w-full h-1/2 bg-amber-600">
    <h1 class="text-5xl pr-20">
        LOGIN
    </h1>
    <div class="flex flex-col gap-4 justify-center w-1/2 bg-amber-500 h-full items-center">
        <input class="w-full h-12 rounded bg-white" type="email" [(ngModel)]="creds.email" placeholder="E-mail" />
        <input class="w-full h-12 rounded bg-white" type="password" [(ngModel)]="creds.password" placeholder="Senha" />

        <button class="rounded cursor-pointer w-full h-12 bg-amber-300" (click)="login()">Entrar</button>

        <a class="hover:underline cursor-pointer">Esqueci minha senha</a>

        <div class="flex flex-row justify-around items-center w-[65%]">
            <span>Não tem uma conta?</span>
            <a class="hover:underline cursor-pointer" (click)="showRegister()">Registre-se</a>
        </div>
        <button class="cursor-pointer w-1/3 h-10 bg-amber-400 rounded text-xl" (click)="cancel()">
            Voltar
        </button>
    </div>
</div>
