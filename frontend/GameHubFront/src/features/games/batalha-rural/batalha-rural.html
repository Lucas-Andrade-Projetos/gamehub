<div class="min-h-screen w-full bgImg bg-fixed">
    @if (connectError()) {
        <div class="min-h-screen flex items-center justify-center px-6">
            <p class="font-yusei text-center text-red-700 bg-white/85 backdrop-blur-sm border-2 border-red-400 rounded-xl px-6 py-4 shadow-lg max-w-md">
                {{ connectError() }}
            </p>
        </div>
    } @else {
        @switch (phase()) {
            @case ('room-select') {
                <app-batalha-rural-room-select (roomJoined)="onRoomJoined($event)" />
            }
            @case ('lobby') {
                <app-batalha-rural-lobby [roomCode]="roomCode()!" (leftRoom)="onLeftRoom()" />
            }
            @case ('placement') {
                <app-batalha-rural-placement [gameId]="gameId()!" [roomCode]="roomCode()!" />
            }
            @case ('battle') {
                <app-batalha-rural-battle [gameId]="gameId()!" [roomCode]="roomCode()!" (returnedToRoom)="onReturnedToRoom()" />
            }
        }
    }
</div>
