<div class="min-h-screen">
    @if (connectError()) {
        <p class="text-red-600 font-yusei text-center pt-40">{{ connectError() }}</p>
    } @else {
        @switch (phase()) {
            @case ('room-select') {
                <app-batalha-rural-room-select (roomJoined)="onRoomJoined($event)" />
            }
            @case ('lobby') {
                <app-batalha-rural-lobby [roomCode]="roomCode()!" />
            }
            @case ('placement') {
                <app-batalha-rural-placement [gameId]="gameId()!" [roomCode]="roomCode()!" />
            }
            @case ('battle') {
                <app-batalha-rural-battle [gameId]="gameId()!" />
            }
        }
    }
</div>
