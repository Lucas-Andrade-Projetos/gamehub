<div class="flex flex-col items-center gap-8 pt-40 pb-10 min-h-screen">
    <h2 class="font-duality text-3xl tracking-wide select-none">Batalha Rural</h2>

    <button
        class="font-duality tracking-widest border-3 border-amber-700 rounded px-10 py-3 bg-transparent hover:bg-amber-400 transition-all duration-200 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
        [disabled]="creating()" (click)="createRoom()">
        @if (creating()) {
            CRIANDO...
        } @else {
            CRIAR SALA
        }
    </button>

    <div class="flex gap-2 items-center">
        <input
            class="border-2 border-amber-700 rounded px-3 py-2 font-duality tracking-widest uppercase w-32 text-center"
            maxlength="5" placeholder="CÓDIGO" [(ngModel)]="codeInput" (keydown.enter)="joinRoom(codeInput)" />
        <button
            class="font-duality border-2 border-amber-700 rounded px-4 py-2 cursor-pointer hover:bg-amber-400 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
            [disabled]="joining()" (click)="joinRoom(codeInput)">
            ENTRAR
        </button>
    </div>

    @if (errorMessage()) {
        <p class="text-red-600 font-yusei text-center">{{ errorMessage() }}</p>
    }

    <div class="w-full max-w-md flex flex-col gap-2">
        <h3 class="font-duality text-xl text-center">Salas abertas</h3>
        @if (openRooms().length === 0) {
            <p class="font-yusei text-center text-sm">Nenhuma sala aberta no momento.</p>
        }
        @for (room of openRooms(); track room.code) {
            <div class="flex justify-between items-center border border-amber-700 rounded px-4 py-2">
                <span class="font-yusei">{{ room.hostNickname }}</span>
                <button
                    class="font-duality text-sm border border-amber-700 rounded px-3 py-1 cursor-pointer hover:bg-amber-400 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                    [disabled]="joining()" (click)="joinRoom(room.code)">
                    ENTRAR
                </button>
            </div>
        }
    </div>
</div>
